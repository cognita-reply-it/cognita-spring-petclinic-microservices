<h2>Pet</h2>

<form name="petForm" class="form-horizontal" ng-submit="$ctrl.submit(petForm)" novalidate>
    <div class="alert alert-danger" ng-if="$ctrl.formErrorMessage">{{$ctrl.formErrorMessage}}</div>

    <div class="form-group">
        <label class="col-sm-2 control-label">Owner</label>
        <div class="col-sm-6">
            <p class="form-control-static">{{$ctrl.pet.owner}}</p>
        </div>
    </div>

    <div class="form-group" ng-class="{'has-error': $ctrl.formErrors.name || (petForm.name.$error.required && petForm.$submitted)}">
        <label class="col-sm-2 control-label">Name </label>
        <div class="col-sm-6">
            <input class="form-control col-sm-4" ng-model="$ctrl.pet.name" name="name" required type="text"/>
            <span ng-show="petForm.name.$error.required && petForm.$submitted" class="help-inline">Name is required.</span>
            <span ng-show="$ctrl.formErrors.name" class="help-inline">{{$ctrl.formErrors.name}}</span>
        </div>
    </div>

    <div class="form-group" ng-class="{'has-error': $ctrl.formErrors.birthDate || (petForm.birthDate.$error.required && petForm.$submitted)}">
        <label class="col-sm-2 control-label">Birth date</label>
        <div class="col-sm-6">
            <input class="form-control" ng-model="$ctrl.pet.birthDate" name="birthDate" required type="date"/>
            <span ng-show="petForm.birthDate.$error.required && petForm.$submitted" class="help-inline">Birth date is required.</span>
            <span ng-show="$ctrl.formErrors.birthDate" class="help-inline">{{$ctrl.formErrors.birthDate}}</span>
        </div>
    </div>

    <div class="form-group" ng-class="{'has-error': $ctrl.formErrors.typeId || (petForm.typeId.$error.required && petForm.$submitted)}">
        <label class="col-sm-2 control-label">Type</label>
        <div class="col-sm-6">
            <select class="form-control" ng-model="$ctrl.petTypeId" name="typeId" required>
                <option ng-repeat="t in $ctrl.types track by t.id" value="{{t.id}}">{{t.name}}</option>
            </select>
            <span ng-show="petForm.typeId.$error.required && petForm.$submitted" class="help-inline">Pet type is required.</span>
            <span ng-show="$ctrl.formErrors.typeId" class="help-inline">{{$ctrl.formErrors.typeId}}</span>
        </div>
    </div>

    <div class="form-group">
        <div class="col-sm-6 col-sm-offset-2">
            <button class="btn btn-primary" type="submit">
                Submit
            </button>
        </div>
    </div>
</form>
